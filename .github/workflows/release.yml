name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = from conventional commits since the last tag)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      brscan_version:
        description: Brother brscan4 driver version baked into the image
        type: string
        default: 0.4.11-1

permissions:
  contents: write
  packages: write

concurrency: release

jobs:
  test:
    runs-on: ubuntu-latest
    # Same base and system packages as the Dockerfile
    container: python:3.15.2-slim-bookworm
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        run: |
          apt-get update -q
          apt-get install -q -y --no-install-recommends imagemagick make
          sed -i '/pattern="PDF"/d' /etc/ImageMagick-6/policy.xml

      - run: make init

      - run: make test

  release:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        # run: |
        #   last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
        #   if [ -z "$last" ]; then
        #     # First release: ship whatever pyproject.toml says
        #     version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
        #   else
        #     if [ -z "$(git log "$last"..HEAD --oneline)" ]; then
        #       echo "::error::No commits since $last"
        #       exit 1
        #     fi
        #     if [ "$BUMP" = auto ]; then
        #       log=$(git log "$last"..HEAD --format='%s%n%b')
        #       if echo "$log" | grep -qE '^[a-z]+(\(.+\))?!:|^BREAKING[ -]CHANGE'; then
        #         BUMP=major
        #       elif echo "$log" | grep -qE '^feat(\(.+\))?:'; then
        #         BUMP=minor
        #       else
        #         BUMP=patch
        #       fi
        #     fi
        #     IFS=. read -r major minor patch <<< "${last#v}"
        #     case $BUMP in
        #       major) version=$((major + 1)).0.0 ;;
        #       minor) version=$major.$((minor + 1)).0 ;;
        #       patch) version=$major.$minor.$((patch + 1)) ;;
        #     esac
        #   fi
        #   echo "Releasing v$version (previous: ${last:-none}, bump: $BUMP)"
        #   echo "version=$version" >> "$GITHUB_OUTPUT"
        #   echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        run: |
          version=1.0.0
          echo "Releasing v$version (previous: ${last:-none}, bump: $BUMP)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # - name: Set version in pyproject.toml
      #   run: sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.version }}"/' pyproject.toml

      - name: Build sdist
        run: pipx run build --sdist

      - name: Build image
        env:
          BRSCAN_VERSION: ${{ inputs.brscan_version }}
        run: |
          docker build --build-arg BRSCAN_VERSION="$BRSCAN_VERSION" \
            -t ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }} \
            -t ${{ steps.version.outputs.image }}:latest .

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "Release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD "v${{ steps.version.outputs.version }}"

      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags ${{ steps.version.outputs.image }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/*.tar.gz \
            --title "v${{ steps.version.outputs.version }}" --generate-notes
